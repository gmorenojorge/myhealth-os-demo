    function composer() { return `<form id="composer" class="composer"><label class="sr-only" for="prompt">Escribe algo a tu Companion</label><textarea id="prompt" rows="1" maxlength="1200" placeholder="Pregunta, cuenta o pide una acción…" autocomplete="off" required></textarea><button type="submit" aria-label="Enviar" title="Enviar">↗</button></form><p class="composer-note">Modo local verificable: consulta los registros sin enviar información a una IA externa.</p>`; }
    function home() { let goals = MH.localGoals().filter(g => g.status === 'active'); return `<div class="main-wrap"><div class="hero-intro"><div class="eyebrow">UN ESPACIO PARA LO IMPORTANTE <span>·</span> ${MH.displayDate(MH.iso())}</div><h1>No es un dashboard.<br/><em>Es tu salud en diálogo.</em></h1><p>Cuéntame algo, pregúntame por tu historia o transforma una intención en un paso concreto.</p></div>${focus()}<div class="dialogue-head"><div><span class="eyebrow">TU COMPANION</span><h2>¿Qué necesitas?</h2></div><span class="local-pill">◉ Datos locales</span></div><section id="dialogue" class="dialogue" aria-label="Conversación">${messages.length ? messages.map(chatMessage).join('') : `<div class="welcome-copy"><span class="assistant-avatar">✳</span><div><strong>Estoy aquí para conectar lo que sabes de tu salud.</strong><p>${archive.events.length ? 'He encontrado ' + archive.events.length + ' acontecimientos confirmados de distintas versiones. Puedo responder con sus fuentes.' : 'Todavía no encuentro acontecimientos confirmados. Podemos empezar a registrar tu día.'}</p></div></div>`}${pendingCard()}</section><div class="suggestions"><button data-suggest="¿Cómo me ha ido esta semana?">Mi semana ↗</button><button data-suggest="¿Qué entrenamientos y registros de energía tengo?">Actividad y energía ↗</button><button data-suggest="Crear un programa de recuperación">Mi próximo paso ↗</button></div>${composer()}${goals.length ? `<p class="goal-chip"><span>OBJETIVO ACTIVO</span> ${MH.esc(goals[0].title)}</p>` : ''}</div>`; }
    function history() {
        const s = MH.snapshot(archive.events);
        const categories = ['Todas', 'Actividad', 'Comida', 'Bienestar', 'Sueño', 'Síntoma', 'Medición', 'Otro'];
        let entries = filtered(archive.events, historyFilter).slice(0, 120);
        return `<div class="main-wrap content"><span class="eyebrow">HISTORIA · CON PROCEDENCIA</span><h1>Lo que has<br/><em>registrado.</em></h1><p class="lead">Reúno acontecimientos confirmados de los laboratorios anteriores y de esta versión, sin modificar los originales.</p>${summary()}<div class="section-row"><h2>Tus acontecimientos</h2><span>${archive.events.length} registros</span></div><div class="category-scroll">${categories.map(x => `<button class="category ${historyFilter === x ? 'selected' : ''}" data-filter="${x}">${x}</button>`).join('')}</div>${entries.length ? `<section class="history-list">${entries.map(eventCard).join('')}</section>` : `<div class="empty-view">No hay registros confirmados para este filtro.</div>`}<p class="quiet">En los últimos siete días: ${s.total} registros distribuidos en ${s.daysCovered} días. Un día sin registros no equivale a un día sin actividad.</p></div>`;
    }
    function programs() {
        const ex = MH.localExperiments().slice().reverse();
        const priorRaw = MH.readJSON(MH.legacyKeys.programs, []), legacyPrograms = MH.isArray(priorRaw) ? priorRaw : [];
        const priorPlanRaw = MH.readJSON(MH.legacyKeys.plans, []), legacyPlans = MH.isArray(priorPlanRaw) ? priorPlanRaw : [];
        const previous = [...legacyPrograms.filter(x => MH.obj(x).title).map(x => ({ title: MH.clean(MH.obj(x).title, 140), description: MH.clean(MH.obj(x).question, 240), status: MH.clean(MH.obj(x).status, 50), source: 'Health Lab · 0.17' })), ...legacyPlans.filter(x => MH.obj(x).title).map(x => ({ title: MH.clean(MH.obj(x).title, 140), description: MH.clean(MH.obj(x).action, 240), status: MH.clean(MH.obj(x).status, 50), source: 'Mis planes · 0.16' }))].slice(-25);
        return `<div class="main-wrap content"><span class="eyebrow">INTENCIONES QUE SE CONVIERTEN EN PRÁCTICA</span><h1>Pequeños planes.<br/><em>Mejor contexto.</em></h1><p class="lead">Programas personales de observación, no experimentos clínicos ni diagnósticos. Los avances son opcionales y tú decides qué registrar.</p><button class="dark-button" data-start-plan>Crear programa de 14 días ↗</button>${ex.length ? ex.map(x => `<article class="plan-card"><div class="plan-head"><span>${x.status === 'active' ? 'EN CURSO' : 'FINALIZADO'}</span><span>${x.duration} DÍAS</span></div><h2>${MH.esc(x.title)}</h2><p>${MH.esc(x.question)}</p><div class="progress-line"><span style="width:${Math.min(100, Math.round(x.logs.length / x.duration * 100))}%"></span></div><div class="plan-footer"><span>${x.logs.length} días con seguimiento registrado · comenzó ${MH.displayDate(x.start)}</span>${x.status === 'active' ? `<button data-log="${MH.esc(x.id)}">Registrar hoy →</button>` : ''}</div>${x.logs.length ? `<details><summary>Ver respuestas registradas</summary>${x.logs.slice(-5).map(l => `<p class="plan-log">${MH.displayDate(l.date)} · ${MH.esc(l.note)}</p>`).join('')}</details>` : ''}</article>`).join('') : `<div class="empty-view">Aún no has creado programas en 1.0. Puedes comenzar aquí o pedírselo al Companion.</div>`}${previous.length ? `<div class="section-row"><h2>Programas anteriores</h2><span>Solo lectura</span></div><p class="quiet">Permanecen en LAB 0.18 y no pueden editarse desde esta alpha.</p>${previous.map(x => `<article class="legacy-plan"><div><span>${MH.esc(x.source)} · ${MH.esc(x.status)}</span><strong>${MH.esc(x.title)}</strong><p>${MH.esc(x.description)}</p></div></article>`).join('')}<a class="return-link" href="lab-018.html?v=018">Abrir programas en LAB 0.18 ↗</a>` : ''}</div>`;
    }
    function privacy() { const i = archive.imported; return `<div class="main-wrap content"><span class="eyebrow">PRIVACIDAD Y CONTROL</span><h1>Tus datos.<br/><em>Tus decisiones.</em></h1><p class="lead">Esta versión funciona sin enviar tus consultas ni información personal a un servidor de IA. Lee el historial anterior en modo de solo lectura.</p><div class="privacy-grid"><article><span>FUENTES ANTERIORES</span><h3>${archive.events.filter(e => e.origin !== 'v1-local').length}</h3><p>Registros confirmados accesibles desde LAB 0.18 y versiones previas.</p></article><article><span>NUEVOS REGISTROS 1.0</span><h3>${MH.localEvents().length}</h3><p>Guardados en una zona independiente del navegador.</p></article><article><span>NOTAS DEL DIARIO ORIGINAL</span><h3>${i.notes}</h3><p>Leídas desde IndexedDB sin alterar la base anterior.</p></article><article><span>ENVÍOS A SERVIDORES</span><h3>0</h3><p>Esta alpha no conecta con Workers, ni utiliza servicios de IA externos.</p></article></div><div class="setting-card"><h2>Exportación y control</h2><p>Puedes exportar los registros, objetivos y programas creados en 1.0. El archivo no está cifrado: guárdalo de forma privada, nunca en GitHub.</p><button class="dark-button" data-export>Exportar mis datos nuevos ↓</button><button class="outline-button" data-clear>Eliminar únicamente los datos nuevos de 1.0</button><p class="quiet">La eliminación nunca toca las claves de LAB 0.18 ni los audios existentes.</p></div>${archive.errors.length ? `<div class="warning"><strong>Lectura parcial</strong><p>${archive.errors.map(MH.esc).join(' · ')}</p></div>` : ''}<a class="return-link" href="lab-018.html?v=018">Abrir el laboratorio anterior ↗</a></div>`; }
    function render() { document.title = 'MyHealth OS · 1.0 Alpha'; document.documentElement.lang = 'es'; root().innerHTML = `<div class="app-frame">${sidebar()}<div class="main-panel">${header()}<main id="content">${loading ? '<div class="loading">Preparando tu contexto…</div>' : view === 'home' ? home() : view === 'history' ? history() : view === 'programs' ? programs() : privacy()}</main></div>${mobileNav()}</div><div id="notification" role="status" aria-live="polite">${MH.esc(statusText)}</div>`; if (statusText)
        setTimeout(() => { const n = document.getElementById('notification'); if (n)
            n.textContent = ''; }, 3000); }
    function notice(x) { statusText = x; render(); }
    async function refresh() { archive = await MH.loadLegacy(); loading = false; render(); }
    function send(input) { messages.push({ role: 'user', text: input }); const answer = MH.interpret(input, archive.events); messages.push({ role: 'assistant', text: answer.message, result: answer }); pending = answer.action || null; render(); document.querySelector('#dialogue')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    function confirm() {
        if (!pending)
            return;
        const a = pending;
        const edit = document.getElementById('approve-title');
        if (edit)
            a.payload[a.type === 'event' ? 'title' : a.type === 'experiment' ? 'title' : a.type === 'goal' ? 'title' : 'note'] = edit.value.trim();
        if (a.type === 'event') {
            a.payload.kind = document.getElementById('approve-kind')?.value || '';
            a.payload.date = document.getElementById('approve-date')?.value || MH.iso();
        }
        if (a.type === 'checkin') {
            a.payload.feeling = document.getElementById('approve-feeling')?.value || '';
            a.payload.energy = document.getElementById('approve-energy')?.value || '';
            a.payload.stress = document.getElementById('approve-stress')?.value || '';
            a.payload.note = document.getElementById('approve-note')?.value || '';
        }
        if (a.type === 'experiment') {
            a.payload.question = document.getElementById('approve-question')?.value.trim() || '';
            a.payload.duration = document.getElementById('approve-duration')?.value || '14';
        }
        try {
            if (a.type === 'event')
                MH.addEvent(a.payload);
            if (a.type === 'checkin')
                MH.addCheckin(a.payload);
            if (a.type === 'goal')
                MH.setGoal(a.payload);
            if (a.type === 'experiment')
                MH.startExperiment(a.payload);
            if (a.type === 'log')
                MH.logExperiment(a.payload);
            pending = null;
            messages.push({ role: 'assistant', text: 'Acción confirmada y guardada solo en este navegador. Ya se puede consultar en tu historia o en tus programas.' });
            refresh().then(() => notice('Guardado con tu confirmación.'));
        }
        catch (e) {
            notice(e instanceof Error ? e.message : 'No se pudo guardar.');
        }
    }
    function openCheckin() { view = 'home'; messages = []; pending = { type: 'checkin', title: 'Registrar bienestar', description: 'Indica solo lo que quieras. Ningún campo aislado es obligatorio.', payload: { feeling: '', energy: '', stress: '', note: '' } }; render(); }
    function openCapture() { view = 'home'; messages = []; pending = { type: 'event', title: 'Nuevo acontecimiento', description: 'Escribe un hecho concreto. Solo se guardará si confirmas.', payload: { title: '', detail: '' } }; render(); document.getElementById('approve-title')?.focus(); }
    function startPlan() { view = 'home'; messages = []; pending = { type: 'experiment', title: 'Nuevo programa personal', description: 'Programa de observación con respuesta diaria opcional.', payload: { title: 'Mejorar mi recuperación', question: '¿Cómo me encuentro hoy?', duration: '14' } }; render(); }
    function askLog(id) { view = 'home'; messages = []; const exp = MH.localExperiments().find(x => x.id === id); if (!exp)
        return; pending = { type: 'log', title: 'Registrar seguimiento', description: exp.title + ' · hoy', payload: { id, note: '' } }; render(); }
    function attachEvents() {
        document.addEventListener('click', async (e) => {
            const target = e.target;
            if (!target)
                return;
            const btn = target.closest('[data-view],[data-why],[data-focus-action],[data-suggest],[data-filter],[data-confirm],[data-reject],[data-start-plan],[data-log],[data-export],[data-clear]');
            if (!btn)
                return;
            e.preventDefault();
            if (btn.dataset.view) {
                view = btn.dataset.view;
                pending = null;
                showWhy = false;
                render();
                window.scrollTo({ top: 0, behavior: 'instant' });
                return;
            }
            if (btn.hasAttribute('data-why')) {
                showWhy = !showWhy;
                render();
                return;
            }
            if (btn.dataset.focusAction) {
                const a = btn.dataset.focusAction;
                if (a === 'capture')
                    openCheckin();
                else if (a === 'experiment') {
                    const exp = MH.localExperiments().find(x => x.status === 'active' && !x.logs.some(l => l.date === MH.iso()));
                    if (exp)
                        askLog(exp.id);
                    else
                        startPlan();
                }
                else {
                    view = 'history';
                    render();
                }
                return;
            }
            if (btn.dataset.suggest) {
                view = 'home';
                send(btn.dataset.suggest);
                return;
            }
            if (btn.dataset.filter) {
                historyFilter = btn.dataset.filter;
                render();
                return;
            }
            if (btn.hasAttribute('data-confirm')) {
                confirm();
                return;
            }
            if (btn.hasAttribute('data-reject')) {
                pending = null;
                notice('Propuesta descartada. No se ha guardado nada.');
                return;
            }
            if (btn.hasAttribute('data-start-plan')) {
                startPlan();
                return;
            }
            if (btn.dataset.log) {
                askLog(btn.dataset.log);
                return;
            }
            if (btn.hasAttribute('data-export')) {
                MH.exportNewData();
                return;
            }
            if (btn.hasAttribute('data-clear')) {
                if (confirmDialog('¿Eliminar solo los registros, objetivos y programas creados en MyHealth OS 1.0? Los datos de LAB 0.18 seguirán intactos.')) {
                    MH.clearOnlyV1();
                    messages = [];
                    pending = null;
                    await refresh();
                    notice('Se han eliminado exclusivamente los datos nuevos de 1.0.');
                }
                return;
            }
        });
        document.addEventListener('submit', e => { if (e.target.id !== 'composer')
            return; e.preventDefault(); const input = document.getElementById('prompt'); if (input?.value.trim())
            send(input.value.trim()); });
        document.addEventListener('keydown', e => { const el = e.target; if (el.id === 'prompt' && e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('composer')?.requestSubmit();
        } });
    }
    const confirmDialog = (msg) => window.confirm(msg);
    async function start() { attachEvents(); render(); await refresh(); }
    MH.start = start;
})(MH || (MH = {}));
window.addEventListener('DOMContentLoaded', () => void MH.start());
</script></body></html>
